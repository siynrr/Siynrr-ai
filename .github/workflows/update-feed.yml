
name: Update Siynrr Article Index

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install feed parser
        run: pip install feedparser

      - name: Fetch and clean Blogger RSS
        run: |
          python - <<'PY'
          import feedparser
          from pathlib import Path
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          import re

          class CleanHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1
                  elif tag in ("p", "div", "br", "li", "tr"):
                      self.parts.append(" ")

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1
                  elif tag in ("p", "div", "li", "tr"):
                      self.parts.append(" ")

              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          def clean_html(value):
              parser = CleanHTML()
              parser.feed(value or "")
              text = " ".join(parser.parts)
              return re.sub(r"\s+", " ", text).strip()

          FEED_URL = "https://www.siynrr.me/feeds/posts/default?alt=rss"
          feed = feedparser.parse(FEED_URL)

          if not feed.entries:
              raise RuntimeError("RSS returned no articles. Existing index preserved.")

          entries = feed.entries[:30]

          lines = [
              "# Siynrr — Latest Articles",
              "",
              "> Automatically generated from the official Siynrr RSS feed.",
              "",
              f"Last updated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              "",
              f"Articles discovered: {len(entries)}",
              "",
          ]

          for entry in entries:
              title = clean_html(entry.get("title", "Untitled"))
              url = entry.get("link", "")
              published = clean_html(entry.get("published", "Date unavailable"))
              summary = clean_html(entry.get("summary", ""))

              lines.extend([
                  f"## {title}",
                  "",
                  f"- URL: {url}",
                  f"- Published: {published}",
              ])

              if summary:
                  lines.append(f"- Summary: {summary[:500]}")

              lines.append("")

          lines.extend([
              "## Original Sources",
              "",
              "- Website: https://www.siynrr.me/",
              "- RSS: https://www.siynrr.me/feeds/posts/default?alt=rss",
              "- Sitemap: https://www.siynrr.me/sitemap.xml",
              "",
          ])

          Path("latest-articles.md").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print(f"Successfully generated {len(entries)} article entries.")
          PY

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-articles.md
          git diff --cached --quiet || git commit -m "Update latest articles from RSS"
          git push
